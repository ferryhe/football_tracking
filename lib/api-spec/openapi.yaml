          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BallApiErrorResponse'
        '428':
          description: A strong If-Match header is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BallApiErrorResponse'
        '422':
