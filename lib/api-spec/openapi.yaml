      summary: Suggest Field Setup
      operationId: suggest_field_setup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldSuggestionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldSuggestionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /inputs/quality-check:
    post:
      tags:
      - inputs
      summary: Check Input Quality
      operationId: check_input_quality
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InputQualityRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InputQualityResponse'
        '404':
          description: Input video or config not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '400':
          description: Input video could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs:
    get:
      tags:
      - runs
      summary: List Runs
      operationId: list_runs
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunRecord'
                title: Response List Runs Api V1 Runs Get
    delete:
      tags:
      - runs
      summary: Delete Run Output
      operationId: delete_run_output
      parameters:
      - name: run_id
        in: query
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResourceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - runs
      summary: Create Run
      operationId: create_run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/asset-groups:
    get:
      tags:
      - runs
      summary: List Asset Groups
      operationId: list_asset_groups
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AssetGroup'
                type: array
                title: Response List Asset Groups Api V1 Runs Asset Groups Get
  /runs/{run_id}:
    get:
      tags:
      - runs
      summary: Get Run
      operationId: get_run
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}/ai-review-triggers:
    get:
      tags:
      - artifacts
      summary: Get Ai Review Triggers Report
      operationId: get_ai_review_triggers_report
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReviewTriggerReport'
        '404':
          description: Run or AI review trigger report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}/artifacts:
    get:
      tags:
      - artifacts
      summary: List Artifacts
      operationId: list_artifacts
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtifactSummary'
                title: Response List Artifacts Api V1 Runs  Run Id  Artifacts Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}/artifacts/{artifact_name}:
    get:
      tags:
      - artifacts
      summary: Get Artifact
      operationId: get_artifact
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: artifact_name
        in: path
        required: true
        schema:
          type: string
          title: Artifact Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}/ball-audit:
    get:
      tags:
      - artifacts
      summary: Get Ball Audit Report
      operationId: get_ball_audit_report
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BallAuditReport'
        '404':
          description: Run or ball audit report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}/camera-path:
    get:
      tags:
      - artifacts
      summary: Get Camera Path
      operationId: get_camera_path
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 5000
          minimum: 1
          default: 500
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraPathResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}/cancel:
    post:
      tags:
      - runs
      summary: Cancel Run
      operationId: cancel_run
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}/cleanup-report:
    get:
      tags:
      - artifacts
      summary: Get Cleanup Report
      operationId: get_cleanup_report
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}/event-candidates:
    get:
      tags:
      - artifacts
      summary: Get Event Candidates Report
      operationId: get_event_candidates_report
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCandidateReport'
        '404':
          description: Run or event candidate report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}/follow-cam-render:
    post:
      tags:
      - runs
      summary: Create Follow Cam Render
      operationId: create_follow_cam_render
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowCamRenderRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunRecord'
        '404':
          description: Run, config, input video, or track CSV not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Render could not be queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}/follow-cam-report:
    get:
      tags:
      - artifacts
      summary: Get Follow Cam Report
      operationId: get_follow_cam_report
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}/highlight-render:
    post:
      tags:
      - runs
      summary: Create Highlight Render
      operationId: create_highlight_render
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HighlightRenderRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunRecord'
        '404':
          description: Run, event candidate, config, input video, or track CSV not
            found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Highlight render could not be queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /runs/{run_id}/player-tracks:
    get:
      tags:
      - artifacts
      summary: Get Player Tracks Report
      operationId: get_player_tracks_report
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerTracksReport'
        '404':
          description: Run or player tracks report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /healthz:
    get:
      tags:
      - health
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  schemas:
    AIConfigDiffRequest:
      properties:
        base_config_name:
          type: string
          title: Base Config Name
        patch:
          additionalProperties: true
          type: object
          title: Patch
        output_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Name
      type: object
      required:
      - base_config_name
      title: AIConfigDiffRequest
    AIConfigDiffResponse:
      properties:
        base_config_name:
          type: string
          title: Base Config Name
        output_name:
          type: string
          title: Output Name
        patch:
          additionalProperties: true
          type: object
          title: Patch
        patch_preview:
          items:
            type: string
          type: array
          title: Patch Preview
      type: object
      required:
      - base_config_name
      - output_name
      title: AIConfigDiffResponse
    AIExplainRequest:
      properties:
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
        config_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Config Name
        focus:
          anyOf:
          - type: string
          - type: 'null'
          title: Focus
        language:
          type: string
          enum:
          - en
          - zh
          title: Language
          default: en
      type: object
      title: AIExplainRequest
    AIExplainResponse:
      properties:
        summary:
          type: string
          title: Summary
        evidence:
          items:
            type: string
          type: array
          title: Evidence
      type: object
      required:
      - summary
      title: AIExplainResponse
    AIRecommendRequest:
      properties:
        run_id:
          type: string
          title: Run Id
        objective:
          anyOf:
          - type: string
          - type: 'null'
          title: Objective
        language:
          type: string
          enum:
          - en
          - zh
          title: Language
          default: en
      type: object
      required:
      - run_id
      title: AIRecommendRequest
    AIReviewDecision:
      properties:
        needs_ai_review:
          type: boolean
          title: Needs Ai Review
        priority:
          type: string
          enum:
          - none
          - low
          - medium
          - high
          title: Priority
        reason:
          type: string
          title: Reason
        trigger_count:
          type: integer
          title: Trigger Count
        recommended_review_windows:
          items:
            $ref: '#/components/schemas/AIReviewWindow'
          type: array
          title: Recommended Review Windows
      type: object
      required:
      - needs_ai_review
      - priority
      - reason
      - trigger_count
      title: AIReviewDecision
    AIReviewSummary:
      properties:
        counts_by_type:
          additionalProperties:
            type: integer
          type: object
          title: Counts By Type
        counts_by_priority:
          additionalProperties:
            type: integer
          type: object
          title: Counts By Priority
        max_trigger_priority:
          type: string
          enum:
          - none
          - low
          - medium
          - high
          title: Max Trigger Priority
      type: object
      required:
      - max_trigger_priority
      title: AIReviewSummary
    AIReviewTrigger:
      properties:
        id:
          type: string
          title: Id
        type:
          type: string
          title: Type
        priority:
          type: string
          enum:
          - none
          - low
          - medium
          - high
          title: Priority
        source:
          type: string
          title: Source
        start_frame:
          anyOf:
          - type: integer
          - type: 'null'
          title: Start Frame
        end_frame:
          anyOf:
          - type: integer
          - type: 'null'
          title: End Frame
        frame_count:
          type: integer
          title: Frame Count
        reason:
          type: string
          title: Reason
        evidence:
          additionalProperties: true
          type: object
          title: Evidence
      type: object
      required:
      - id
      - type
      - priority
      - source
      - frame_count
      - reason
      title: AIReviewTrigger
    AIReviewTriggerReport:
      properties:
        schema_version:
          type: string
          title: Schema Version
        generated_at:
          type: string
          title: Generated At
        decision:
          $ref: '#/components/schemas/AIReviewDecision'
        triggers:
          items:
            $ref: '#/components/schemas/AIReviewTrigger'
          type: array
          title: Triggers
        summary:
          $ref: '#/components/schemas/AIReviewSummary'
      type: object
      required:
      - schema_version
      - generated_at
      - decision
      - summary
      title: AIReviewTriggerReport
    AIReviewWindow:
      properties:
        start_frame:
          type: integer
          title: Start Frame
        end_frame:
          type: integer
          title: End Frame
        reason:
          type: string
          title: Reason
      type: object
      required:
      - start_frame
      - end_frame
      - reason
      title: AIReviewWindow
    AISuggestion:
      properties:
        title:
          type: string
          title: Title
        diagnosis:
          type: string
          title: Diagnosis
        recommendation:
          type: string
          title: Recommendation
        expected_tradeoff:
          type: string
          title: Expected Tradeoff
        patch:
          additionalProperties: true
          type: object
          title: Patch
        patch_preview:
          items:
            type: string
          type: array
          title: Patch Preview
        evidence:
          items:
            type: string
          type: array
          title: Evidence
        output_name_suggestion:
