  /ball-annotation-sessions/{session_id}/frames/{frame_index}:
    get:
      tags:
      - ball-annotations
      summary: Get Ball Annotation Frame
      operationId: get_ball_annotation_frame
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: frame_index
        in: path
        required: true
        schema:
          type: integer
          title: Frame Index
      responses:
        '200':
          description: Exact immutable source-frame JPEG evidence.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          headers:
            Content-Length:
              description: JPEG payload length in bytes.
              schema:
                type: integer
                minimum: 1
            ETag:
              description: Strong ETag for the exact JPEG bytes.
              schema:
                type: string
            X-Content-SHA256:
              description: SHA-256 digest of the exact JPEG bytes.
              schema:
                type: string
                pattern: ^[0-9a-f]{64}$
            X-Source-Frame-Index:
              description: Bound source-video frame index.
              schema:
                type: integer
                minimum: 0
            Cache-Control:
              description: This evidence response must not be cached.
              schema:
                type: string
                enum:
                - no-store
        '400':
          description: API-safe error with a stable code and message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BallApiErrorResponse'
        '404':
          description: API-safe error with a stable code and message.
