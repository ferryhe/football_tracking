          title: Action Code
        target_step:
          type: string
          const: field_setup
          title: Target Step
        reason_code:
          type: string
          const: field_geometry_requires_new_calibration
          title: Reason Code
        affected_paths:
          items:
            type: string
            enum:
            - filtering.roi
            - scene_bias.ground_zones
            - scene_bias.negative_rois
          type: array
          maxItems: 3
          minItems: 3
          title: Affected Paths
        lineage_constraint:
          type: string
          const: invalidate_trial_and_downstream_then_create_new_calibration_version
          title: Lineage Constraint
      additionalProperties: false
      type: object
      required:
      - action_code
      - target_step
      - reason_code
      - affected_paths
      - lineage_constraint
      title: TrialTuningAction
    TrialTuningControl:
      properties:
        path:
          type: string
          title: Path
        section:
          type: string
          enum:
          - detector
          - sahi
          - filtering
          - selection
          - tracking
          - postprocess
          title: Section
        kind:
          type: string
          enum:
          - number
          - integer
          - boolean
          - select
          - multi_select
          title: Kind
        minimum:
          anyOf:
          - type: number
          - type: 'null'
          title: Minimum
        maximum:
          anyOf:
          - type: number
          - type: 'null'
          title: Maximum
        step:
          anyOf:
          - type: number
          - type: 'null'
          title: Step
        options:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Options
        runtime_impact:
          type: string
          enum:
          - low
          - medium
          - high
          title: Runtime Impact
        description:
          type: string
          title: Description
        description_zh:
          type: string
          title: Description Zh
      additionalProperties: false
      type: object
      required:
      - path
      - section
      - kind
      - runtime_impact
      - description
      - description_zh
      title: TrialTuningControl
    TrialTuningSchemaResponse:
      properties:
        schema_version:
          type: string
          const: '1.0'
          title: Schema Version
          default: '1.0'
        patch_schema_version:
          type: string
          const: '1.0'
          title: Patch Schema Version
          default: '1.0'
        controls:
          items:
            $ref: '#/components/schemas/TrialTuningControl'
          type: array
          minItems: 1
          title: Controls
        actions:
          items:
            $ref: '#/components/schemas/TrialTuningAction'
          type: array
          maxItems: 1
          minItems: 1
          title: Actions
      type: object
      required:
      - controls
      - actions
      title: TrialTuningSchemaResponse
    UpdateConfigRequest:
      properties:
        content:
          type: string
          title: Content
      type: object
      required:
      - content
      title: UpdateConfigRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
      - status
servers:
- url: /api
