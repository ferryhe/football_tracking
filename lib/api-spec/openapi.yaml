openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
paths:
  /ai/config-diff:
    post:
      tags:
      - ai
      summary: Config Diff
      operationId: config_diff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIConfigDiffRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIConfigDiffResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ai/explain:
    post:
      tags:
      - ai
      summary: Explain
      operationId: explain
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIExplainRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIExplainResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ai/recommend:
    post:
      tags:
      - ai
      summary: Recommend
      operationId: recommend
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIRecommendRequest'
        required: true
      responses:
        '200':
          description: Successful Response
