  /ball-annotation-sessions/{session_id}/annotations/{frame_index}:
    put:
      tags:
      - ball-annotations
      summary: Put Ball Annotation
      operationId: put_ball_annotation
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: frame_index
        in: path
        required: true
        schema:
          type: integer
          title: Frame Index
      - name: If-Match
        in: header
        required: true
        description: Strong ETag of the current effective annotation revision. Runtime
          omission returns 428.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BallAnnotationRevisionRequest'
      responses:
        '200':
          description: Append-only annotation revision accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BallAnnotationRevisionResponse'
          headers:
            ETag:
              description: Strong ETag for the new effective annotation revision.
              schema:
                type: string
            Cache-Control:
              description: This evidence response must not be cached.
              schema:
                type: string
                enum:
                - no-store
        '400':
          description: API-safe error with a stable code and message.
          content:
            application/json:
