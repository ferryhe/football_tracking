name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  node:
    name: Node
    runs-on: ubuntu-latest
    env:
      BASE_PATH: "/"
      PORT: "5173"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated API clients
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src/generated
          changes="$(git status --porcelain -- lib/api-client-react/src/generated lib/api-zod/src/generated)"
          if [ -n "$changes" ]; then
            echo "$changes"
            exit 1
          fi

      - name: Test broadcast workflow state and validation
        run: |
          pnpm --filter @workspace/web run test:broadcast-workflow
          pnpm --filter @workspace/web run test:broadcast-components

      - name: Type-check workspace
        run: pnpm run typecheck

      - name: Build workspace
        run: pnpm -r --if-present run build

  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            python_backend/requirements.txt
            python_backend/requirements-dev.txt
            scripts/ci-python-constraints.txt

      - name: Create project virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: .venv/bin/python -m pip install -r python_backend/requirements-dev.txt -c scripts/ci-python-constraints.txt

      - name: Run official Python verification route
        run: .venv/bin/python python_backend/scripts/project.py test --python-only
